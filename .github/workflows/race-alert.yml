name: Race report alert

# Asks the site every 20 minutes, Saturday to Monday (UTC), whether the latest race report is
# complete. The site sends the phone alert once per race; every other call does nothing.
on:
  schedule:
    - cron: "*/20 * * * 0,1,6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS --max-time 90 https://telemetry-1.vercel.app/api/informe/alerta
