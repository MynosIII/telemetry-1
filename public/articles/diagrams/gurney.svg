<title id="title">Geometría conceptual de un Gurney en un alerón invertido</title><desc id="desc">Perfil invertido con una pestaña que se eleva sobre la cara de presión en el borde de salida. La cuerda c y altura h están indicadas; el dibujo no representa una simulación.</desc>
