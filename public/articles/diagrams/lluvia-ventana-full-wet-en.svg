<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">The full wet tyre's window, conceptual sketch</title><desc id="desc">The full wet tyre's window, conceptual sketch. Conceptual sketch, not to scale. The limits move with every track, car and shower.</desc>
<rect width="760" height="360" fill="#18181c"/>
<g font-family="Inter, Helvetica, Arial, sans-serif"><text x="32" y="44" fill="#eeeeee" font-size="18" font-weight="700">THE FULL WET PARADOX</text><rect x="40" y="96" width="170" height="40" rx="4" fill="#6c6c74" opacity=".55"/><text x="125" y="122" text-anchor="middle" fill="#eeeeee" font-size="15">Slicks</text><rect x="214" y="96" width="250" height="40" rx="4" fill="#2f9e5b"/><text x="339" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Intermediates</text><rect x="468" y="96" width="252" height="40" rx="4" fill="#2f6fd6"/><text x="594" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Full wet</text><rect x="530" y="160" width="190" height="58" rx="4" fill="#ff3027" opacity=".22" stroke="#ff3027"/><text x="625" y="186" text-anchor="middle" fill="#eeeeee" font-size="13"><tspan x="625">Not enough visibility:</tspan><tspan x="625" dy="18">red flag or Safety Car</tspan></text><path d="M468 270 H528" stroke="#eeeeee" stroke-width="2"/><path d="M468 264 V276 M528 264 V276" stroke="#eeeeee" stroke-width="2"/><text x="498" y="298" text-anchor="middle" fill="#eeeeee" font-size="13">Full wet's real window</text><path d="M530 136 V160" stroke="#ff3027" stroke-dasharray="3 4"/><line x1="40" y1="76" x2="720" y2="76" stroke="#3a3a40"/><text x="720" y="70" text-anchor="end" fill="#a6a6ad" font-size="12">MORE WATER ON TRACK →</text><text x="32" y="336" fill="#a6a6ad" font-size="12">Conceptual sketch, not to scale. The limits move with every track, car and shower.</text></g>
</svg>
