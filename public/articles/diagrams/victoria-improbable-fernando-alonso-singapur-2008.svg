<g font-family="Inter, Helvetica, Arial, sans-serif"><text x="32" y="44" fill="#eeeeee" font-size="18" font-weight="700">GRAN PREMIO DE SINGAPUR 2008: CHANCES DE GANAR</text><text x="32" y="68" fill="#a6a6ad" font-size="13">Probabilidad de victoria según el modelo v7.6</text><text x="286" y="113" text-anchor="end" fill="#a6a6ad" font-size="15">Lewis Hamilton</text><rect x="300" y="98" width="380.0" height="22" rx="4" fill="#6c6c74"/><text x="688.0" y="114" fill="#eeeeee" font-size="14" font-weight="600">21%</text><text x="286" y="153" text-anchor="end" fill="#a6a6ad" font-size="15">Robert Kubica</text><rect x="300" y="138" width="253.2" height="22" rx="4" fill="#6c6c74"/><text x="561.2" y="154" fill="#eeeeee" font-size="14" font-weight="600">14%</text><text x="286" y="193" text-anchor="end" fill="#a6a6ad" font-size="15">Heikki Kovalainen</text><rect x="300" y="178" width="200.0" height="22" rx="4" fill="#6c6c74"/><text x="508.0" y="194" fill="#eeeeee" font-size="14" font-weight="600">11%</text><text x="286" y="233" text-anchor="end" fill="#eeeeee" font-size="15">Fernando Alonso (ganó)</text><rect x="300" y="218" width="23.8" height="22" rx="4" fill="#ff3027"/><text x="331.8" y="234" fill="#eeeeee" font-size="14" font-weight="600">1,3%</text><text x="32" y="282" fill="#6c6c74" font-size="12">Fuente: modelo v7.6 y archivo de Telemetry One (F1DB).</text></g>
