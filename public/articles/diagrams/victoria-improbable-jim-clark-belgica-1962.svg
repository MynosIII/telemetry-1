<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Gran Premio de Bélgica 1962: chances de ganar</title><desc id="desc">Probabilidad de victoria según el modelo v7.6. Fuente: modelo v7.6 y archivo de Telemetry One (F1DB).</desc>
<rect width="760" height="300" fill="#18181c"/>
<g font-family="Inter, Helvetica, Arial, sans-serif"><text x="32" y="44" fill="#eeeeee" font-size="18" font-weight="700">GRAN PREMIO DE BÉLGICA 1962: CHANCES DE GANAR</text><text x="32" y="68" fill="#a6a6ad" font-size="13">Probabilidad de victoria según el modelo v7.6</text><text x="286" y="113" text-anchor="end" fill="#a6a6ad" font-size="15">Bruce McLaren</text><rect x="300" y="98" width="380.0" height="22" rx="4" fill="#6c6c74"/><text x="688.0" y="114" fill="#eeeeee" font-size="14" font-weight="600">39%</text><text x="286" y="153" text-anchor="end" fill="#a6a6ad" font-size="15">Phil Hill</text><rect x="300" y="138" width="145.8" height="22" rx="4" fill="#6c6c74"/><text x="453.8" y="154" fill="#eeeeee" font-size="14" font-weight="600">15%</text><text x="286" y="193" text-anchor="end" fill="#a6a6ad" font-size="15">Tony Maggs</text><rect x="300" y="178" width="81.8" height="22" rx="4" fill="#6c6c74"/><text x="389.8" y="194" fill="#eeeeee" font-size="14" font-weight="600">8,4%</text><text x="286" y="233" text-anchor="end" fill="#eeeeee" font-size="15">Jim Clark (ganó)</text><rect x="300" y="218" width="8.1" height="22" rx="4" fill="#ff3027"/><text x="316.1" y="234" fill="#eeeeee" font-size="14" font-weight="600">0,8%</text><text x="32" y="282" fill="#6c6c74" font-size="12">Fuente: modelo v7.6 y archivo de Telemetry One (F1DB).</text></g>
</svg>
