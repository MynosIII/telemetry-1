<title id="title">Winning margin: Spa 1963 and Nürburgring 1968 against each era's median</title><desc id="desc">Winning margin: Spa 1963 and Nürburgring 1968 against each era's median. Median of races won on time. Source: Telemetry One archive (F1DB).</desc>
